<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Anjaneya Ventures | Wear Your Strength</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 85px;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #080808;
      color: #fff;
      line-height: 1.6;
    }

    :root {
      --gold: #d4af37;
      --gold-light: #f0d77a;
      --dark: #080808;
      --card: #111;
      --gray: #aaa;
    }


    /* =========================
       NAVBAR
    ========================= */

    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      background: rgba(8, 8, 8, 0.96);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #222;
    }

    .nav-container {
      max-width: 1200px;
      margin: auto;
      padding: 18px 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      color: var(--gold);
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .nav-links {
      display: flex;
      gap: 28px;
      list-style: none;
    }

    .nav-links a {
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: 0.3s;
    }

    .nav-links a:hover {
      color: var(--gold);
    }

    .menu-btn {
      display: none;
      color: white;
      font-size: 26px;
      cursor: pointer;
    }


    /* =========================
       LAUNCH / COMING SOON
    ========================= */

    .launch-wrapper {
      padding-top: 65px;
      background: #080808;
    }

    .launch-announcement {
      position: relative;
      overflow: hidden;
      text-align: center;
      padding: 28px 20px 25px;

      background:
        radial-gradient(
          circle at center,
          rgba(212,175,55,0.16),
          transparent 55%
        ),
        linear-gradient(
          135deg,
          #080808,
          #171309,
          #080808
        );

      border-bottom: 1px solid rgba(212,175,55,0.35);
    }

    .launch-announcement::before {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 2px;

      background: linear-gradient(
        90deg,
        transparent,
        var(--gold),
        transparent
      );

      animation: launchShine 4s linear infinite;
    }

    @keyframes launchShine {
      0% {
        left: -100%;
      }

      100% {
        left: 100%;
      }
    }

    .launch-label {
      color: var(--gold);
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .launch-announcement h2 {
      font-size: clamp(24px, 4vw, 38px);
      font-weight: 900;
      letter-spacing: 3px;
      margin-bottom: 5px;
    }

    .launch-announcement p {
      max-width: 680px;
      margin: 0 auto;
      color: #aaa;
      font-size: 14px;
    }

    .launch-date {
      display: inline-block;
      margin-top: 13px;
      padding: 7px 20px;

      border: 1px solid var(--gold);
      color: var(--gold);

      font-size: 11px;
      font-weight: bold;
      letter-spacing: 3px;
    }

    .launch-announcement span {
      display: block;
      margin-top: 7px;
      color: #777;
      font-size: 11px;
    }


    /* =========================
       HERO
    ========================= */

    .hero {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      text-align: center;

      padding: 100px 20px 80px;

      background:
        radial-gradient(
          circle at center,
          rgba(212,175,55,0.15),
          transparent 35%
        ),
        linear-gradient(
          135deg,
          #050505,
          #151515
        );
    }

    .hero-content {
      max-width: 900px;
    }

    .hero-small {
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 5px;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .hero h1 {
      font-size: clamp(48px, 9vw, 110px);
      line-height: 0.95;
      letter-spacing: 4px;
      font-weight: 900;
    }

    .hero h1 span {
      color: var(--gold);
    }

    .hero-tagline {
      font-size: clamp(20px, 3vw, 32px);
      margin: 28px 0 15px;
      font-weight: 700;
    }

    .hero p {
      max-width: 650px;
      margin: auto;
      color: #bbb;
      font-size: 17px;
    }


    /* =========================
       BUTTONS
    ========================= */

    .buttons {
      margin-top: 35px;

      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;

      padding: 14px 28px;

      text-decoration: none;
      text-transform: uppercase;

      letter-spacing: 1px;
      font-weight: bold;

      border: 1px solid var(--gold);

      transition: 0.3s;
    }

    .btn-primary {
      background: var(--gold);
      color: #000;
    }

    .btn-primary:hover {
      background: var(--gold-light);
      transform: translateY(-3px);
    }

    .btn-outline {
      color: white;
    }

    .btn-outline:hover {
      background: var(--gold);
      color: #000;
    }


    /* =========================
       GENERAL
    ========================= */

    section {
      padding: 90px 20px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    .section-title {
      text-align: center;
      margin-bottom: 55px;
    }

    .section-title span {
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 3px;
      font-size: 13px;
    }

    .section-title h2 {
      font-size: clamp(32px, 5vw, 55px);
      margin-top: 8px;
    }


    /* =========================
       STORY
    ========================= */

    .story {
      background: #0d0d0d;
    }

    .story-content {
      max-width: 850px;
      margin: auto;
      text-align: center;
    }

    .story-content p {
      color: #bbb;
      font-size: 17px;
      margin-bottom: 20px;
    }

    .highlight {
      color: var(--gold);
      font-weight: bold;
    }


    /* =========================
       PHILOSOPHY
    ========================= */

    .philosophy-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .philosophy-card {
      background: var(--card);

      border: 1px solid #222;

      padding: 35px 20px;

      text-align: center;

      transition: 0.3s;
    }

    .philosophy-card:hover {
      border-color: var(--gold);
      transform: translateY(-7px);
    }

    .number {
      color: var(--gold);
      font-size: 35px;
      font-weight: bold;
    }

    .philosophy-card h3 {
      margin: 15px 0 8px;
    }

    .philosophy-card p {
      color: var(--gray);
      font-size: 14px;
    }


    /* =========================
       COLLECTIONS
    ========================= */

    .collections {
      background: #0d0d0d;
    }

    .collection-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;

      align-items: flex-end;
