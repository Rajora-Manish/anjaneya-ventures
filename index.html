<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Anjaneya Ventures | Wear Your Strength</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #080808;
      color: #fff;
      line-height: 1.6;
    }

    :root {
      --gold: #d4af37;
      --gold-light: #f0d77a;
      --card: #111;
      --gray: #aaa;
    }

    /* =========================
       LAUNCH BANNER
    ========================= */

    .launch-banner {
      width: 100%;
      background:
        linear-gradient(90deg, #050505, #17130a, #050505);
      border-bottom: 1px solid rgba(212,175,55,0.35);
      padding: 12px 20px;
      text-align: center;
    }

    .launch-banner-content {
      max-width: 1200px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      flex-wrap: wrap;
    }

    .launch-banner-label {
      color: var(--gold);
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 3px;
    }

    .launch-banner-title {
      color: #fff;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1.5px;
    }

    .launch-banner-text {
      color: #999;
      font-size: 11px;
    }

    /* NAVBAR */

    nav {
      position: sticky;
      top: 0;
      width: 100%;
      z-index: 1000;
      background: rgba(8, 8, 8, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #222;
    }

    .nav-container {
      max-width: 1200px;
      margin: auto;
      padding: 18px 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      color: var(--gold);
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .nav-links {
      display: flex;
      gap: 28px;
      list-style: none;
    }

    .nav-links a {
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: 0.3s;
    }

    .nav-links a:hover {
      color: var(--gold);
    }

    .menu-btn {
      display: none;
      color: white;
      font-size: 26px;
      cursor: pointer;
    }

    /* HERO */

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 100px 20px 80px;

      background:
        radial-gradient(
          circle at center,
          rgba(212,175,55,0.15),
          transparent 35%
        ),
        linear-gradient(135deg, #050505, #151515);
    }

    .hero-content {
      max-width: 900px;
    }

    .hero-small {
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 5px;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .hero h1 {
      font-size: clamp(48px, 9vw, 110px);
      line-height: 0.95;
      letter-spacing: 4px;
      font-weight: 900;
    }

    .hero h1 span {
      color: var(--gold);
    }

    .hero-tagline {
      font-size: clamp(20px, 3vw, 32px);
      margin: 28px 0 15px;
      font-weight: 700;
    }

    .hero p {
      max-width: 650px;
      margin: auto;
      color: #bbb;
      font-size: 17px;
    }

    .buttons {
      margin-top: 35px;
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      padding: 14px 28px;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: bold;
      border: 1px solid var(--gold);
      transition: 0.3s;
    }

    .btn-primary {
      background: var(--gold);
      color: #000;
    }

    .btn-primary:hover {
      background: var(--gold-light);
      transform: translateY(-3px);
    }

    .btn-outline {
      color: white;
    }

    .btn-outline:hover {
      background: var(--gold);
      color: #000;
    }

    /* GENERAL */

    section {
      padding: 90px 20px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    .section-title {
      text-align: center;
      margin-bottom: 55px;
    }

    .section-title span {
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 3px;
      font-size: 13px;
    }

    .section-title h2 {
      font-size: clamp(32px, 5vw, 55px);
      margin-top: 8px;
    }

    /* STORY */

    .story {
      background: #0d0d0d;
    }

    .story-content {
      max-width: 850px;
      margin: auto;
      text-align: center;
    }

    .story-content p {
      color: #bbb;
      font-size: 17px;
      margin-bottom: 20px;
    }

    .highlight {
      color: var(--gold);
      font-weight: bold;
    }
